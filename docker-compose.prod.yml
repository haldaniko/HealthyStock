services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env.production
    volumes:
      - healthystock_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    image: healthystock-backend-prod
    build:
      context: ./backend
      target: prod
    env_file: ./.env.production
    environment:
      POSTGRES_HOST: postgres
      HOST_DATA_DIR: /host
      OLD_UPLOAD_DIR: /old-uploads
    volumes:
      - type: bind
        source: .
        target: /host
      - healthystock_prod_uploads:/old-uploads:ro
    command: ["node", "scripts/migrate-production.mjs"]
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: healthystock-backend-prod
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "4104:4000"
    volumes:
      - type: bind
        source: .
        target: /host
    env_file:
      - path: ./backend/.env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: sqlite:/host/db.sqlite3
      UPLOAD_DIR: /host/media
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      admin-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: healthystock-frontend-prod
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    env_file: ./.env.production
    ports:
      - "8099:3000"
    depends_on:
      backend:
        condition: service_healthy

  admin-seed:
    image: healthystock-backend-prod
    env_file:
      - path: ./.env.production
        required: true
    environment:
      DATABASE_URL: sqlite:/host/db.sqlite3
    volumes:
      - type: bind
        source: .
        target: /host
    command: ["node", "scripts/seed-superadmin.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  healthystock_prod_postgres_data:
  healthystock_prod_uploads:
